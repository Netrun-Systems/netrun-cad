# Netrun CAD — Azure DevOps Build Pipeline
# Windows / MSVC / Qt6 build for Allie's landscape design tool
# Produces: portable zip artifact

trigger:
  branches:
    include:
      - landscape-design
      - master

pr:
  branches:
    include:
      - landscape-design

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  qtVersion: '6.9.0'
  artifactName: 'NetrunCAD-Win64-Portable'

steps:
  - checkout: self
    fetchDepth: 0
    submodules: recursive
    displayName: 'Checkout'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
    displayName: 'Use Python 3.x'

  - script: |
      pip install aqtinstall
      aqt install-qt windows desktop %QTVERSION% win64_msvc2022_64 --modules qt5compat qtimageformats qtshadertools --outputdir "%AGENT_TOOLSDIRECTORY%\Qt"
    displayName: 'Install Qt6 via aqtinstall'
    env:
      QTVERSION: $(qtVersion)

  - powershell: |
      $qtBase = Get-ChildItem -Path "$env:AGENT_TOOLSDIRECTORY\Qt" -Directory | Select-Object -First 1
      $qtDir = Get-ChildItem -Path $qtBase.FullName -Filter "msvc2022_64" -Directory -Recurse | Select-Object -First 1
      Write-Host "Found Qt at: $($qtDir.FullName)"
      Write-Host "##vso[task.setvariable variable=QTDIR]$($qtDir.FullName)"
      Write-Host "##vso[task.prependpath]$($qtDir.FullName)\bin"
    displayName: 'Locate Qt install path'

  - script: |
      mkdir build
      cd build
      cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%QTDIR%" -DCMAKE_BUILD_TYPE=Release -DBUILD_LANDSCAPE_PLUGINS=ON
    displayName: 'CMake Configure'

  - script: |
      cd build
      cmake --build . --config Release -- /m:8
    displayName: 'CMake Build (Release)'

  - powershell: |
      $releaseDir = "$(Build.ArtifactStagingDirectory)\NetrunCAD"
      New-Item -ItemType Directory -Path $releaseDir -Force
      New-Item -ItemType Directory -Path "$releaseDir\plugins" -Force

      # Copy main executable
      Copy-Item "build\Release\LibreCAD.exe" "$releaseDir\" -ErrorAction SilentlyContinue
      Copy-Item "build\desktop\Release\LibreCAD.exe" "$releaseDir\" -ErrorAction SilentlyContinue

      # Copy Qt DLLs
      & "$env:QTDIR\bin\windeployqt.exe" "$releaseDir\LibreCAD.exe" 2>$null

      # Copy landscape plugins
      Get-ChildItem -Path "build" -Filter "*.dll" -Recurse | Where-Object { $_.DirectoryName -match "landscape|plugin" } | ForEach-Object {
        Copy-Item $_.FullName "$releaseDir\plugins\" -Force
        Write-Host "Plugin: $($_.Name)"
      }

      # Copy landscape resources
      if (Test-Path "landscape") {
        Copy-Item "landscape" "$releaseDir\landscape" -Recurse -Force
      }

      # Copy LibreCAD resources
      if (Test-Path "librecad\support") {
        Copy-Item "librecad\support" "$releaseDir\support" -Recurse -Force
      }

      Write-Host "Package contents:"
      Get-ChildItem "$releaseDir" -Recurse | ForEach-Object { Write-Host "  $($_.FullName.Replace($releaseDir, ''))" }
    displayName: 'Package portable zip'

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)\NetrunCAD'
      includeRootFolder: true
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)\$(artifactName).zip'
    displayName: 'Create zip archive'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)\$(artifactName).zip'
      ArtifactName: '$(artifactName)'
    displayName: 'Publish artifact'
