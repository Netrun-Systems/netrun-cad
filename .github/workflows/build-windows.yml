name: Build Netrun CAD (Windows x64)

on:
  push:
    branches: [landscape-design, master]
  pull_request:
    branches: [landscape-design]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'windows'
          arch: 'win64_msvc2022_64'
          target: 'desktop'
          tools-only: 'false'
          modules: 'qt3d qt5compat qtimageformats qtshadertools'
          tools: 'tools_cmake'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Boost
        run: |
          curl -# -L -o boost.7z https://archives.boost.io/release/1.87.0/source/boost_1_87_0.7z
          7z x -o. -y boost.7z
          mkdir -p boost/include
          mv boost_1_87_0/boost boost/include/
          rm boost.7z
        shell: bash

      - name: CMake Configure
        run: |
          cmake.exe -S . -B generated -G "Visual Studio 17 2022" -DBoost_INCLUDE_DIR=%BOOST_ROOT%/include -DBoost_LIBRARY_DIRS=%BOOST_ROOT%/lib -DBUILD_LANDSCAPE_PLUGINS=ON
        shell: cmd
        env:
          BOOST_ROOT: boost
          CMAKE_CXX_FLAGS: " /MP8"

      - name: CMake Build
        run: cmake --build generated --config Release
        shell: cmd

      - name: Package
        shell: powershell
        run: |
          $releaseDir = "$env:GITHUB_WORKSPACE\package\NetrunCAD"
          New-Item -ItemType Directory -Path $releaseDir -Force
          New-Item -ItemType Directory -Path "$releaseDir\plugins" -Force

          # Find executable
          $exe = Get-ChildItem -Path "generated" -Filter "LibreCAD.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "$releaseDir\LibreCAD.exe"
            Write-Host "Exe: $($exe.FullName)"
          } else {
            Write-Host "LibreCAD.exe not found in generated/"
            Get-ChildItem -Path "generated" -Filter "*.exe" -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

          # Deploy Qt DLLs
          & windeployqt "$releaseDir\LibreCAD.exe" --release --no-translations 2>$null

          # Copy landscape plugins
          Get-ChildItem -Path "generated" -Filter "*.dll" -Recurse | Where-Object {
            $_.DirectoryName -match "landscape" -and $_.Name -notmatch "^Qt"
          } | ForEach-Object {
            Copy-Item $_.FullName "$releaseDir\plugins\" -Force
            Write-Host "Plugin: $($_.Name)"
          }

          # Copy landscape resources
          if (Test-Path "landscape") {
            Copy-Item "landscape" "$releaseDir\landscape" -Recurse -Force
          }

          # Copy LibreCAD resources
          if (Test-Path "librecad\support") {
            Copy-Item "librecad\support" "$releaseDir\support" -Recurse -Force
          }

          $size = [math]::Round((Get-ChildItem "$releaseDir" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Package: $size MB"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetrunCAD-Win64-Portable
          path: package/NetrunCAD/
          retention-days: 30
